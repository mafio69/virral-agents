services:
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: slim_ovh_ai_app
    user: "1000:1000" # UID:GID procesu; ustawienia instalacji, bez .env
    working_dir: /var/www
    command: ["sh", "docker/start-app.sh"]
    volumes:
      - ./:/var/www
      - ./docker/php-fpm-env.conf:/usr/local/etc/php-fpm.d/zz-virral-env.conf:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      APP_ENV: ${APP_ENV:-prod}
      OVH_AI_ENDPOINTS_ACCESS_TOKEN: ${OVH_AI_ENDPOINTS_ACCESS_TOKEN:-}
      DB_HASH: ${DB_HASH:-}
      USER_DATA_KEY: ${USER_DATA_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      OPEN_AI_KEY: ${OPEN_AI_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_KEY: ${GEMINI_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
      MCP_SEARCH_URL: http://mcp-search:8000/mcp
      MAIL_DSN: ${MAIL_DSN:-}
      PHP_IDE_CONFIG: serverName=slim-ovh-ai
    networks:
      - default
      - ai

  mailpit:
    image: axllent/mailpit:v1.31.6
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: 100
    networks:
      - default

  nginx:
    image: nginx:1.27-alpine
    container_name: slim_ovh_ai_nginx
    ports:
      - "8181:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app

networks:
  ai:
    external: true
