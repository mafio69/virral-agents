name: Deploy Production

on:
  workflow_run:
    workflows: ["Tests"]
    branches: [master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Optiplex via Tailscale
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    steps:
      - name: Verify required secrets
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=()
          for name in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Brak wymaganych sekretów w środowisku production: ${missing[*]}" >&2
            exit 1
          fi

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Nieprawidłowy docelowy commit SHA." >&2
            exit 1
          fi

          trim() {
            local v="$1"
            v="${v//$'\r'/}"
            v="${v//$'\n'/}"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }

          deploy_host="$(trim "$DEPLOY_HOST")"
          deploy_user="$(trim "$DEPLOY_USER")"
          ssh_port="$(trim "${DEPLOY_PORT:-22}")"
          ssh_port="${ssh_port:-22}"
          if [[ -z "$deploy_host" || -z "$deploy_user" ]]; then
            echo "Pusty DEPLOY_HOST lub DEPLOY_USER." >&2
            exit 1
          fi
          if [[ ! "$ssh_port" =~ ^[0-9]+$ ]]; then
            echo "Nieprawidłowy port SSH w DEPLOY_PORT." >&2
            exit 1
          fi

          ssh_dir="$(mktemp -d)"
          chmod 700 "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT

          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$ssh_dir/id_deploy"
          chmod 600 "$ssh_dir/id_deploy"
          if ! ssh-keygen -y -P "" -f "$ssh_dir/id_deploy" >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY nie jest poprawnym kluczem prywatnym SSH bez hasła." >&2
            exit 1
          fi

          # Connection runs strictly inside the authenticated Tailscale WireGuard mesh (tag:ci).
          ssh-keyscan -T 15 -p "$ssh_port" -t ed25519 "$deploy_host" 2>/dev/null > "$ssh_dir/known_hosts" || true
          chmod 600 "$ssh_dir/known_hosts"
          if [ ! -s "$ssh_dir/known_hosts" ]; then
            echo "Nie udało się pobrać klucza hosta ED25519 po Tailscale (sprawdź DEPLOY_HOST, DEPLOY_PORT i ACL)." >&2
            exit 1
          fi

          # Na serwer idzie wyłącznie "<hash> auto|manual". Klucz CI ma w authorized_keys wymuszoną komendę
          # (ops/deploy-virral-agents) — cała logika wdrożenia i ścieżka repo są po stronie serwera.
          mode=manual
          [ "$DEPLOY_EVENT" = workflow_run ] && mode=auto

          out=$(ssh \
            -i "$ssh_dir/id_deploy" \
            -p "$ssh_port" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 \
            -o BatchMode=yes \
            "${deploy_user}@${deploy_host}" \
            "$DEPLOY_TARGET_SHA $mode") || { echo "$out"; exit 1; }
          echo "$out"
          last=$(printf '%s\n' "$out" | tail -n 1)
          case "$last" in
            "wdrozone: $DEPLOY_TARGET_SHA"|"pominieto: "*) ;;
            *) echo "Serwer nie potwierdził wdrożenia $DEPLOY_TARGET_SHA." >&2; exit 1 ;;
          esac
